prefix: "&l&bS16 smp 2& "

messages:
  no-permission: "&cNie masz uprawnień do tej komendy!"
  config-reloaded: "&aKonfiguracja przeładowana!"
  broadcast-sent: "&aOgłoszenie zostało wysłane!"
  history-empty: "&cBrak historii dla tego typu ogłoszeń."
  usage-actionbar: "&cUżycie: /maniusactionbar <wiadomość> [czas s/m/h]"
  usage-bossbar: "&cUżycie: /maniusbossbar <wiadomość> [czas s/m/h]"
  usage-chat: "&cUżycie: /maniuschat <wiadomość>"
  usage-title: "&cUżycie: /maniustitle <wiadomość> [czas s/m/h]"

# Formaty wyświetlania ogłoszeń
formats:
  chat-header: "&b&l[OGŁOSZENIE]"
  chat-format: "{header}\n\n&f{message}"
  actionbar-format: "&e{message}"
  bossbar-format: "&a{message}"
  title-main: "&b&l[OGŁOSZENIE]"
  title-sub: "&f{message}"

# Ustawienia pojawiania się i znikania napisu na środku (Title)
title-settings:
  default-duration: 5 # domyślny czas w sekundach, jeśli nie podasz czasu w komendzie
  fade-in: 10         # czas pojawiania się w tickach (20 ticków = 1s)
  fade-out: 10        # czas znikania w tickach

auto-announcer:
  chat:
    enabled: true
    interval: 300 # czas w sekundach między ogłoszeniami
    messages:
      - "Pamiętaj o zarejestrowaniu się na naszym Discordzie!"
      - "Głosuj na serwer, aby otrzymać darmowe nagrody."
  actionbar:
    enabled: true
    interval: 180 # czas w sekundach między ogłoszeniami
    duration: 5   # domyślny czas wyświetlania w sekundach
    messages:
      - "&aSklep serwerowy: www.twojsklep.pl"
  bossbar:
    enabled: true
    interval: 240 # czas w sekundach między ogłoszeniami
    duration: 10  # domyślny czas wyświetlania w sekundach
    color: "BLUE"
    style: "SOLID"
    messages:
      - "&bWitaj na serwerze! Życzymy miłej gry."

history:
  chat: []
  actionbar: []
  bossbar: []
  title: []
